<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Continuous Timetable with Custom Days</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #fff;
            color: #111;
        }

        .schedule-container,
        .header-row {
            display: flex;
        }

        .time-column,
        .time-spacer {
            width: 60px;
            margin-right: 10px;
            position: relative;
            flex: none;
        }

        .time-label {
            position: absolute;
            left: 0;
            width: 100%;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
        }

        .days-container,
        .day-headers {
            flex: 1;
            display: flex;
        }

        .day-column,
        .day-header {
            flex: 1;
            margin-right: 2px;
        }

        .day-column:last-child,
        .day-header:last-child {
            margin-right: 0;
        }

        .day-header {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .day-column {
            border: 1px solid #ccc;
            position: relative;
            background: #fff;
        }

        .hour-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: #eee;
        }

        .block {
            position: absolute;
            left: 2px;
            right: 2px;
            font-size: 13px;
            font-weight: bold;
            color: #000;
            overflow: hidden;
            padding: 4px;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .person-btn {
            padding: 8px 16px;
            margin: 0 5px;
            font-size: 14px;
            border: 2px solid #ccc;
            background-color: #fff;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .person-btn:hover {
            background-color: #f0f0f0;
        }

        .person-btn.active {
            background-color: #007acc;
            color: white;
            border-color: #007acc;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        #editBtn {
            font: inherit;
            padding: 8px 16px;
            border: 2px solid #111;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        #editBtn:hover {
            background: #f0f0f0;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.94);
        }

        .overlay[hidden] {
            display: none;
        }

        .sheet {
            width: min(440px, 100%);
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
            padding: 18px;
        }

        .sheet h3 {
            margin: 0 0 12px;
        }

        .sheet textarea,
        .sheet input[type="password"] {
            font: inherit;
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .sheet textarea {
            min-height: 110px;
            resize: vertical;
        }

        .sheet-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
        }

        .sheet-actions button,
        .result-actions button {
            font: inherit;
            padding: 8px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        .sheet-actions button.primary,
        .result-actions button.primary {
            background: #007acc;
            color: #fff;
            border-color: #007acc;
        }

        .sheet-actions button:disabled {
            color: #aaa;
            cursor: default;
        }

        .pattern-grid {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 16px auto 0;
            touch-action: none;
        }

        .pattern-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .pattern-dot {
            position: absolute;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border: 2px solid #111;
            border-radius: 50%;
            background: #fff;
            box-sizing: border-box;
        }

        .pattern-dot.used {
            background: #007acc;
            border-color: #007acc;
        }

        #thinking {
            z-index: 30;
            flex-direction: column;
            background: #fff;
        }

        .think-label {
            min-height: 1.4em;
            font-size: 18px;
            transition: opacity 0.35s ease;
        }

        .think-track {
            width: min(420px, 80vw);
            height: 4px;
            margin-top: 22px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .think-bar {
            height: 100%;
            width: 0;
            background: #007acc;
            border-radius: 4px;
        }

        #resultCard {
            margin: 0 0 16px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        #resultCard[hidden] {
            display: none;
        }

        #resultMessage {
            white-space: pre-wrap;
            line-height: 1.45;
        }

        .result-note {
            margin-top: 10px;
            color: #555;
        }

        .result-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h2 style="margin: 0;">Schedule</h2>
        <button id="editBtn" type="button">Edit</button>
    </div>

    <div id="resultCard" hidden>
        <div id="resultMessage"></div>
        <div id="resultNote" class="result-note" hidden></div>
        <div id="resultActions" class="result-actions" hidden>
            <button id="pushBtn" class="primary" type="button">Commit &amp; Push</button>
            <button id="cancelBtn" type="button">Cancel</button>
        </div>
    </div>
    
    <div style="margin-bottom: 20px;">
        <label style="margin-right: 15px;">Select person:</label>
        <button id="adaswiBtn" class="person-btn active">AB</button>
        <button id="aleksBtn" class="person-btn">AK</button>
        <button id="saraBtn" class="person-btn">SD</button>
    </div>

    <div>
        <label>Select week:</label>
        <select id="weekSelect"></select>
    </div>

    <div class="header-row">
        <div class="time-spacer"></div>
        <div class="day-headers" id="dayHeaders"></div>
    </div>

    <div class="schedule-container" id="scheduleContainer">
        <div class="time-column" id="timeColumn"></div>
        <div class="days-container" id="daysContainer"></div>
    </div>

    <div id="sentenceOverlay" class="overlay" hidden>
        <div class="sheet">
            <h3>What should change?</h3>
            <textarea id="sentenceInput" placeholder="I'll be at school on 12/11/2026, from 8 am till 5pm"></textarea>
            <div class="sheet-actions">
                <button id="sentenceClose" type="button">Close</button>
                <button id="sentenceNext" class="primary" type="button" disabled>Next</button>
            </div>
        </div>
    </div>

    <div id="passwordOverlay" class="overlay" hidden>
        <div class="sheet">
            <h3>Password</h3>
            <input id="passwordInput" type="password" autocomplete="off">
            <div id="patternGrid" class="pattern-grid">
                <svg class="pattern-lines" viewBox="0 0 240 240" aria-hidden="true"></svg>
            </div>
            <div class="sheet-actions">
                <button id="passwordBack" type="button">Back</button>
                <button id="passwordAccept" class="primary" type="button" disabled>Accept</button>
            </div>
        </div>
    </div>

    <div id="thinking" class="overlay" hidden>
        <div id="thinkLabel" class="think-label">Reading the timetable</div>
        <div class="think-track"><div id="thinkBar" class="think-bar"></div></div>
    </div>

    <script src="script.js"></script>
    <script src="edit.js"></script>
</body>
</html>
